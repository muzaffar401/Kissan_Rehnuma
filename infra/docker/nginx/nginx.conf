worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Crop/animal detection accepts images up to 10MB — allow headroom.
    client_max_body_size 15m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1024;

    # ── Basic rate limit (safety net; gateway also rate-limits) ──
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    upstream api_gateway {
        server api-gateway:3000;
    }

    server {
        listen 80;
        server_name _;

        # Health endpoint — used by uptime checks / curl tests
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Long timeouts — disease detection calls a vision LLM
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }

        # Token server (voice-agent JWT issuer) — same tunnel, different path
        location /token/ {
            proxy_pass http://voice-token:8080/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── HTTPS block (enable after running certbot — see README) ──
    # server {
    #     listen 443 ssl;
    #     server_name api.yourdomain.com;
    #     ssl_certificate /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
    #     location / {
    #         limit_req zone=api burst=60 nodelay;
    #         proxy_pass http://api_gateway;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #         proxy_read_timeout 180s;
