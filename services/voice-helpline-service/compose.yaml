services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: voice_helpline
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voice_helpline"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - voice_helpline_postgres:/var/lib/postgresql/data

volumes:
  voice_helpline_postgres:

