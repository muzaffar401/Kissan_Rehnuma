[project]
name = "animal-disease-service"
version = "0.1.0"
description = "Kissan Rehnuma — AI-powered animal disease detection microservice"
requires-python = ">=3.12"
dependencies = [
    # ── Web framework ──
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "python-multipart>=0.0.18",

    # ── Config & validation ──
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",

    # ── Database ──
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",

    # ── AI / LLM ──
    "langgraph>=0.4",

    # ── Image processing ──
    "Pillow>=11.0,<12.0",

    # ── Cloud storage ──
    "cloudinary>=1.42,<2.0",

    # ── Observability ──
    "langsmith>=0.3,<1.0",

    # ── Logging ──
    "structlog>=24.0,<26.0",

    # ── Resilience ──
    "tenacity>=9.0,<10.0",
    "httpx>=0.28,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]
