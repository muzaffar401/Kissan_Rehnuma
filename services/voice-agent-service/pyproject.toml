[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-agent-service"
version = "0.1.0"
description = "Kissan Rehnuma Voice Agent Service - LiveKit Agents based voice assistant for Pakistani farmers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # LiveKit Agents Framework
    "livekit-agents>=1.7.0",
    "livekit-plugins-openai>=1.7.0",
    "livekit-plugins-deepgram>=1.7.0",
    "livekit-plugins-upliftai>=1.7.0",
    "livekit-plugins-silero>=1.7.0",
    "livekit>=0.17.0",
    
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    
    # Configuration
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    
    # HTTP Client
    "httpx>=0.26.0",
    "aiohttp>=3.9.0",
    "python-socketio>=5.11.0",

    # Token server (token_server.py)
    "requests>=2.31.0",
    "PyJWT>=2.8.0",
    
    # Utilities
    "python-json-logger>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
